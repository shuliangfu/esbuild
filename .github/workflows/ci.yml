# CI: 三端跨平台测试（Deno / Bun / Node.js 22+），验证跨运行时兼容性
# esbuild 测试套件含 47 个测试文件：单元测试 + Deno/Bun 门控的解析器集成测试。
# Node.js 上 IS_DENO/IS_BUN 门控的测试注册 0 用例（describe 块在 if 守卫内）。
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 工作流级 env：让基于 Node 的 GitHub Actions（如 checkout、setup-*）提前使用 Node 24 运行时，
# 便于在官方强制升级前做性能/稳定性验证。参见 GitHub 文档中的 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Deno（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts

      - name: Check
        run: deno check src/mod.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Deno)
        run: deno test -A tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Bun（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # 测试中资源处理（图片压缩/hash）会用到 ImageMagick；若未安装会触发 brew 自动安装并易在 CI 中 SIGTERM，故在此预先安装
      - name: Install ImageMagick (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install ImageMagick (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install imagemagick

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache Deno dependencies
        continue-on-error: true
        run: deno cache src/mod.ts

      - name: Check
        run: deno check src/mod.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Bun)
        run: bun test tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Node.js 22（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ImageMagick (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install ImageMagick (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install imagemagick

      - name: Install dependencies
        run: npm install

      - name: Test (Node)
        run: npm run test:node
